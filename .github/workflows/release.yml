name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  GIT_CLIFF_VERSION: "2.14.2"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-*.txt

      - name: Install build tooling
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install "git-cliff==${GIT_CLIFF_VERSION}"

      - name: Verify the tag matches the packaged version
        env:
          TAG: ${{ github.ref_name }}
        run: python scripts/check_version_tag.py "$TAG"

      - name: Run the test suite against the tagged tree
        run: pytest -n auto

      - name: Build distribution
        run: python -m build --outdir dist

      - name: Generate release notes
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          git-cliff --config cliff.toml --current --strip header --output RELEASE_NOTES.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: dist/*
          fail_on_unmatched_files: true

      - name: Upload distribution artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distribution
          path: dist/
          if-no-files-found: error

      - name: Summarize release
        run: |
          {
            echo "## Release $GITHUB_REF_NAME"
            echo ""
            cat RELEASE_NOTES.md
            echo ""
            echo "Artifacts:"
            echo ""
            echo '```text'
            ls -1 dist
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
