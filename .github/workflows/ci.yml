name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_DEFAULT: "3.12"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  FORCE_COLOR: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
          cache: pip
          cache-dependency-path: requirements-*.txt
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .
      - name: Install Node dependencies
        run: npm ci
      - name: Ruff lint
        run: ruff check src tests scripts
      - name: Ruff format check
        run: ruff format --check src tests scripts
      - name: ShellCheck
        run: shellcheck scripts/*.sh
      - name: yamllint
        run: yamllint .
      - name: Markdownlint
        run: npx markdownlint "**/*.md"
      - name: Prettier check
        run: npx prettier --check "**/*.md"

  type:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
          cache: pip
          cache-dependency-path: requirements-*.txt
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .
      - name: MyPy (strict)
        run: mypy src tests

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-*.txt
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .
      - name: Run tests with coverage
        run: |
          pytest -n auto --cov=breezy_roleplay \
            --cov-report=term-missing \
            --cov-report=xml \
            --junitxml=junit.xml
      - name: Upload coverage report
        if: always() && matrix.python-version == '3.12'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: warn
      - name: Upload test results
        if: always() && matrix.python-version == '3.12'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: junit-report
          path: junit.xml
          if-no-files-found: warn

  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
          cache: pip
          cache-dependency-path: requirements-*.txt
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .
      - name: Install Node dependencies
        run: npm ci
      - name: Large file budget
        run: bash scripts/check_large_files.sh
      - name: Complexity budget
        run: bash scripts/check_complexity.sh
      - name: TODO ownership
        run: bash scripts/check_todos.sh
      - name: Dead code (vulture)
        run: vulture src
      - name: Unused dependencies (deptry)
        run: deptry src
      - name: Duplicate code (jscpd)
        run: npx jscpd --config .jscpd.json .
      - name: Upload duplication report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jscpd-report
          path: reports/jscpd
          if-no-files-found: warn

  workflows:
    name: Workflow syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: actionlint
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12

  docs:
    name: Docs drift
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
      - name: Regenerate scenario index
        run: bash scripts/generate_scenario_index.sh
      - name: Fail on drift
        run: git diff --exit-code docs/scenarios.md

  precommit:
    name: Pre-commit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT }}
          cache: pip
          cache-dependency-path: requirements-*.txt
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .
      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

  ci-status:
    name: CI status
    if: always()
    needs: [lint, type, test, quality, workflows, docs, precommit]
    runs-on: ubuntu-latest
    steps:
      - name: Summarize job results
        run: |
          {
            echo "## CI summary"
            echo ""
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "| lint | ${{ needs.lint.result }} |"
            echo "| type | ${{ needs.type.result }} |"
            echo "| test | ${{ needs.test.result }} |"
            echo "| quality | ${{ needs.quality.result }} |"
            echo "| workflows | ${{ needs.workflows.result }} |"
            echo "| docs | ${{ needs.docs.result }} |"
            echo "| pre-commit | ${{ needs.precommit.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail if any job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
