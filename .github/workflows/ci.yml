name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install markdownlint
        run: npm install -g markdownlint-cli
      - name: Run markdownlint
        run: markdownlint "**/*.md"
      - name: Check there is at least one scenario file
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # On PR, ensure at least one file in `scenarios`
            if [ "$(git diff --name-only ${{ github.base_ref }})" = "" -a ! -d "scenarios" ]; then
              echo "No scenario files added"
              exit 1
            fi
          fi
