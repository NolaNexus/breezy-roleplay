name: Error To Issue

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: error-to-issue
  cancel-in-progress: false

jobs:
  smoke:
    name: Nightly CLI smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-*.txt

      - name: Install the package
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      - name: Run the smoke test
        id: smoke
        continue-on-error: true
        env:
          SMOKE_REPORT: smoke-report.txt
        run: bash scripts/smoke_test.sh

      - name: Publish the report to the job summary
        if: always()
        run: |
          {
            echo "## Nightly smoke test"
            echo ""
            if [ -s smoke-report.txt ]; then
              echo '```text'
              cat smoke-report.txt
              echo '```'
            else
              echo "No report was produced."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update an issue on failure
        if: steps.smoke.outcome == 'failure'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- nightly-smoke-test -->';
            const report = fs.existsSync('smoke-report.txt')
              ? fs.readFileSync('smoke-report.txt', 'utf8').trim()
              : 'The smoke test produced no report.';
            const truncated = report.length > 60000
              ? report.slice(0, 60000) + '\n\n…truncated; see the workflow run for the rest.'
              : report;

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              '## Nightly smoke test failed',
              '',
              `Workflow run: ${runUrl}`,
              `Commit: \`${context.sha}\``,
              '',
              'The `create`, `archive`, logging, or metrics path regressed. Reproduce locally with:',
              '',
              '```bash',
              'make setup && bash scripts/smoke_test.sh',
              '```',
              '',
              '<details><summary>Smoke test report</summary>',
              '',
              '```text',
              truncated,
              '```',
              '',
              '</details>',
            ].join('\n');

            const { owner, repo } = context.repo;
            const title = 'Nightly smoke test is failing';
            const open = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'type:bug', per_page: 100,
            });
            const existing = open.data.find((issue) => issue.title === title);

            if (existing) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number, body,
              });
              core.info(`updated issue #${existing.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner, repo, title, body,
                labels: ['type:bug', 'priority:P1', 'area:cli'],
              });
              core.info(`opened issue #${created.data.number}`);
            }

      - name: Close the issue when the smoke test recovers
        if: steps.smoke.outcome == 'success'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const title = 'Nightly smoke test is failing';
            const open = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'type:bug', per_page: 100,
            });
            const existing = open.data.find((issue) => issue.title === title);
            if (!existing) {
              core.info('no open smoke test issue');
              return;
            }
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner, repo, issue_number: existing.number,
              body: `Recovered: the nightly smoke test passed in ${runUrl}. Closing.`,
            });
            await github.rest.issues.update({
              owner, repo, issue_number: existing.number, state: 'closed',
            });

      - name: Fail the job when the smoke test failed
        if: steps.smoke.outcome == 'failure'
        run: exit 1
