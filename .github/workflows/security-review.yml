name: Security Review

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install Semgrep
        run: python -m pip install --disable-pip-version-check -r requirements-security.txt
      - name: Run Semgrep (readable report)
        run: |
          semgrep scan \
            --config p/default \
            --config p/secrets \
            --metrics=off \
            --text > semgrep-report.txt
      - name: Run Semgrep (SARIF)
        run: |
          semgrep scan \
            --config p/default \
            --config p/secrets \
            --metrics=off \
            --sarif --output semgrep.sarif
      - name: Upload SARIF to code scanning
        if: always() && hashFiles('semgrep.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep
      - name: Upload security report artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: semgrep-security-report
          path: |
            semgrep-report.txt
            semgrep.sarif
          if-no-files-found: warn
      - name: Publish report to job summary
        if: always()
        run: |
          {
            echo "## Automated security review (Semgrep)"
            echo ""
            if [ -s semgrep-report.txt ]; then
              echo '```text'
              cat semgrep-report.txt
              echo '```'
            else
              echo "Semgrep did not produce a report."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Comment report on pull request
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- semgrep-security-review -->';
            const reportPath = 'semgrep-report.txt';
            const report = fs.existsSync(reportPath)
              ? fs.readFileSync(reportPath, 'utf8').trim()
              : 'Semgrep did not produce a report.';
            const truncated = report.length > 60000
              ? report.slice(0, 60000) + '\n\n…truncated; download the workflow artifact for the full report.'
              : report;
            const body = [
              marker,
              '## Automated security review (Semgrep)',
              '',
              '```text',
              truncated,
              '```',
              '',
              '_Findings are also uploaded to the Security → Code scanning tab._',
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const existing = comments.data.find((comment) => comment.body && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
