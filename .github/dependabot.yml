version: 2
updates:
  # One grouped PR per ecosystem, once a month.
  #
  # Grouping major with minor and patch keeps the notification volume to a single
  # PR per ecosystem instead of one per dependency. `open-pull-requests-limit: 1`
  # caps it even if a group is ever split.
  #
  # `cooldown` holds every release for a week (30 days for majors) before it can
  # be adopted, which is the main defence against a compromised or yanked
  # release being pulled in automatically.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      pip:
        patterns: ["*"]
        update-types: ["major", "minor", "patch"]
    labels:
      - "type:chore"
      - "dependencies"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      npm:
        patterns: ["*"]
        update-types: ["major", "minor", "patch"]
    labels:
      - "type:chore"
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["major", "minor", "patch"]
    labels:
      - "type:chore"
      - "dependencies"
      - "area:ci"
