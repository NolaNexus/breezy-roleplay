# Fast local checks that mirror CI. Installed by `make setup`.
#
# pre-commit pins each hook to an immutable tag; CI runs the same config with
# `pre-commit run --all-files`, so a clean local run means a clean CI run for
# everything except the node-based Markdown and duplication checks.
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-json
        exclude: ^\.devcontainer/|^tsconfig.*\.json$
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: [--maxkb=256]
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: detect-private-key
      - id: forbid-submodules

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.11.0
    hooks:
      - id: shellcheck
        args: [--severity=style]

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [-c, .yamllint]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.1
    hooks:
      - id: mypy
        files: ^(src|tests|scripts)/
        pass_filenames: false
        args: [src, tests]
        additional_dependencies:
          - "pytest==9.2.0"

  - repo: local
    hooks:
      - id: check-todos
        name: TODO markers name an owner or issue
        entry: bash scripts/check_todos.sh
        language: system
        pass_filenames: false
      - id: check-large-files
        name: tracked files stay under the size budget
        entry: bash scripts/check_large_files.sh
        language: system
        pass_filenames: false
      - id: check-complexity
        name: complexity and function length budgets
        entry: bash scripts/check_complexity.sh
        language: system
        pass_filenames: false
      - id: scenario-index
        name: docs/scenarios.md matches scenarios/
        entry: bash -c 'bash scripts/generate_scenario_index.sh && git diff --exit-code docs/scenarios.md'
        language: system
        pass_filenames: false
        files: ^scenarios/.*\.md$|^scripts/generate_scenario_index\.sh$

  - repo: https://github.com/jorisroovers/gitlint
    rev: v0.19.1
    hooks:
      - id: gitlint
        stages: [commit-msg]
